<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>趣味小測驗</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --border: #e5e7eb;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            align-self: center;
        }

        /* 頁面切換設定 */
        .page {
            display: none;
            padding: 2rem 1.5rem;
            flex-direction: column;
            height: auto;
        }
        .page.active {
            display: flex;
        }
        #intro-page.active {
            min-height: calc(100dvh - 2rem);
            justify-content: center;
        }
        #quiz-page.active {
            min-height: calc(100dvh - 2rem);
            max-height: calc(100dvh - 2rem);
            overflow: hidden;
        }
        #result-page {
            padding: 1.5rem 1.5rem 1.25rem;
        }
        #result-page h2 {
            margin-bottom: 0.75rem;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        /* 元件樣式 */
        input[type="text"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-submit { background-color: var(--success); }
        .btn-submit:hover { background-color: #059669; }

        /* 導覽列 (Tabs) */
        .tabs {
            display: flex;
            flex-shrink: 0;
            overflow-x: auto;
            border-bottom: 2px solid var(--border);
            background: var(--card-bg);
            padding: 0 0.5rem;
            scrollbar-width: none; /* Firefox */
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab {
            padding: 1rem 1.2rem;
            white-space: nowrap;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }
        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 測驗區塊 */
        .quiz-content {
            flex: 1 1 0;
            min-height: 0;
            overflow-y: auto;
            padding: 1.5rem 0;
        }

        .question-card {
            margin-bottom: 2rem;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 1rem;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        .option-label:has(input:checked) {
            border-color: var(--primary);
            background-color: #eef2ff;
            color: var(--primary);
            font-weight: bold;
        }
        .option-label input { display: none; }

        /* 底部控制列 */
        .controls {
            display: flex;
            flex-shrink: 0;
            gap: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .controls .btn { flex: 1; }
        .btn-outline {
            background: transparent;
            color: var(--text-muted);
            border: 2px solid var(--border);
        }
        .btn-outline:hover { background: var(--bg-color); }

        /* 結算畫面 */
        .score-display {
            font-size: 4rem;
            font-weight: 800;
            color: var(--primary);
            text-align: center;
            margin: 1rem 0;
        }
        .score-comment {
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 0.75rem;
        }
        .wrong-review-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-top: 0.25rem;
            padding: 0.5rem 0;
            background: none;
            border: none;
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            font-weight: bold;
            color: inherit;
        }
        .wrong-review-toggle:active { opacity: 0.7; }
        .wrong-chevron {
            flex-shrink: 0;
            color: var(--text-muted);
            font-size: 0.75rem;
            transition: transform 0.2s;
        }
        .wrong-review-section.expanded .wrong-chevron { transform: rotate(90deg); }
        .wrong-answers-container {
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 1rem;
        }
        .wrong-answers-container.collapsed { display: none; }
        .wrong-item {
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px dashed #fca5a5;
        }
        .wrong-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .wrong-q { font-weight: bold; margin-bottom: 0.5rem; }
        .wrong-user { color: var(--danger); font-size: 0.9rem; margin-bottom: 0.2rem; }
        .wrong-correct { color: var(--success); font-size: 0.9rem; font-weight: bold; }
        .perfect-score { text-align: center; color: var(--success); font-weight: bold; font-size: 1.1rem; }

        /* 隱藏元素用 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="intro-page" class="page active">
        <h1 style="font-size: 2.5rem;">🎭 How 邱 are you?</h1>
        <input type="text" id="nickname" placeholder="暱稱" autocomplete="off">
        <button class="btn" onclick="startQuiz()">開始測驗</button>
    </div>

    <div id="quiz-page" class="page" style="padding: 0;">
        <div class="tabs" id="tabs-container">
            </div>
        
        <div class="quiz-content" style="padding: 1.5rem;" id="quiz-content">
            </div>

        <div class="controls" style="padding: 1rem 1.5rem 1.5rem;">
            <button class="btn btn-outline" id="prev-btn" onclick="changeSection(-1)">上一步</button>
            <button class="btn" id="next-btn" onclick="changeSection(1)">下一步</button>
            <button class="btn btn-submit hidden" id="submit-btn" onclick="submitQuiz()">交卷</button>
        </div>
    </div>

    <div id="result-page" class="page">
        <h2>測驗結算</h2>
        <div style="text-align: center; color: var(--text-muted); font-size: 1.1rem;" id="result-name"></div>
        <div class="score-display"><span id="final-score"></span><span style="font-size: 1.5rem; color:var(--text-muted);">/100</span></div>
        <div class="score-comment" id="score-comment"></div>
        
        <div class="wrong-review-section" id="wrong-review-section">
            <button type="button" class="wrong-review-toggle" id="wrong-review-toggle" onclick="toggleWrongReview()">
                <span id="wrong-review-label">📝 錯題檢閱</span>
                <span class="wrong-chevron">▶</span>
            </button>
            <div class="wrong-answers-container collapsed" id="wrong-answers"></div>
        </div>
    </div>

</div>

<script>
    /* =========================================
       📦 題庫區 (請在這裡輸入你的題目)
       格式：["問題內容", "正確答案", "錯誤選項1", "錯誤選項2", ...]
       注意：陣列的第二個位置 (Index 1) 必須永遠是正確答案！系統會自動幫你打亂選項。
    ========================================= */
    const rawQuizData = {
        "我": [
            ["綽號", "小慕", "大慕", "阿慕", "慕色迴響"],
            ["生日", "2/5", "2/9", "2/15", "2/25"],
            ["名字裡常被念錯的字", "昀", "邱", "慕", "帆"],
            ["英文名字來源", "幼稚園老師", "國小同學", "YouTube", "報紙"],
            ["BMI最接近", "15.5", "17.5", "19.5", "21.5"]
        ],
        "生活": [
            ["最喜歡的顏色", "水藍", "檸檬黃", "紅色", "炭黑"],
            ["最喜歡的蔬菜", "龍鬚菜", "空心菜", "豆芽菜", "地瓜葉"],
            ["最喜歡的汽水", "雪碧", "可樂", "芬達", "C&C"],
            ["最喜歡的英文歌", "Bad Habbits - Ed Sheeran", "Attention - Charlie Puth", "Lovely - Billie Eilish", "Payphone - Maroon 5"],
            ["最喜歡的服裝品牌", "FILA", "UNIQLO", "GU", "adidas"],
            ["最喜歡的電影類型", "懸疑", "動作", "愛情", "恐怖"],
            ["不喜歡", "以上皆是", "+9", "煙味", "喧囂"],
            ["害怕", "昆蟲", "和外國人溝通", "考試", "出國"],
            ["吃麵習慣用什麼餐具", "湯匙", "筷子", "叉子", "手"],
            ["最不常用AI來", "生成圖片", "蒐集資料", "修飾文字", "生成程式碼"],
        ],
        "學校": [
            ["國小是什麼球隊", "巧固球", "籃球", "排球", "羽球"],
            ["國中班上幾個5A", "5個", "2個", "3個", "6個"],
            ["國、高中都跟誰同班", "劉宇笙", "陳信華", "徐霆宇", "林子皓"],
            ["高中班級", "17", "9", "18", "19"],
            ["和誰同補習班", "林承澤", "林彥安", "胡萬埕", "徐霆宇"],
            ["高中愛上什麼運動", "排球", "桌球", "足球", "游泳"],
            ["最喜歡福利社的哪個麵包", "巧克力派司", "菠蘿麵包", "奶酥麵包", "藍莓寒天貝果"],
            ["高中英文平均", "96.6", "79.0", "86.7", "92.1"],
            ["愛用的英文作文開頭", "It is widely recognized that...", "Imagine + Ving...", "提問", "情境描寫"],
            ["擅長科目排序", "英文>數學>自然>國文>社會", "英文>自然>數學>國文>社會", "數學>英文>自然>國文>社會", "數學>自然>英文>國文>社會"],
        ],
        "機器人": [
            ["機器人教室的指導老師叫", "綠茶老師", "紅茶老師", "柳丁老師", "可樂老師"],
            ["高中比的競賽場數最接近", "20", "12", "16", "24"],
            ["拿過最好的獎", "世界冠軍", "全國第一", "全國第二", "最佳論文發表"],
            ["在團隊中通常不負責", "組裝結構", "編寫程式", "製作報告", "設計海報"],
            ["去比賽回飯店前常買", "泡麵", "雨衣", "布丁", "啤酒"],
            ["哪個不是我做過的專案", "貨運大師", "茂林守護者", "碧海之眼", "SmartHome Hub"],
            ["曾經想過設計", "教官偵測系統", "跑道發電系統", "情緒偵測教室", "樹木健康地圖"],
        ],
        "遊戲": [
            ["不常玩的遊戲類型", "以上皆是", "槍戰", "冒險RPG", "格鬥"],
            ["【第五人格】監管最高段位", "巔七50星", "巔七25星", "七階10星", "六階I"],
            ["最擅長的角色", "使徒", "博士", "機械師", "教授"],
            ["最討厭的監管", "蠟像師", "廠長", "跛腳羊", "傑克"],
            ["求生選角時", "多補位", "搶救人位", "搶修機位", "有前鋒拿前鋒"],
            ["常在什麼地圖掏出博士", "永眠鎮", "湖景村", "唐人街", "紅教堂"],
            ["【Minecraft】最喜歡的石頭", "安山岩", "閃長岩", "花崗岩", "黑石"],
            ["較不擅長", "建築", "生存", "紅石", "指令"],
            ["多人生存喜歡", "以上皆是", "挖礦", "蓋隱藏門", "收集物資"],
            ["蓋的第一張密室逃脫地圖", "消失的家人", "網美餐廳", "Tuff", "空間⁵"],
            ["傳說對決最喜歡的角色", "蘇", "亥牙", "娜塔亞", "颯枷"],
            ["皇室戰爭最喜歡的卡組", "飛桶", "礦炸", "大皮卡", "純法術"],
        ]
    };

    // 狀態變數
    let parsedQuizData = [];
    let currentSectionIndex = 0;
    let userAnswers = {}; // 紀錄選擇題答案 { qId: selectedValue }
    let nickname = "";
    const sections = ["我", "生活", "學校", "機器人", "遊戲", "加分題"];
    
    // 初始化系統
    function initQuiz() {
        let globalQId = 0;
        
        // 解析並打亂選擇題
        sections.slice(0, 5).forEach(category => {
            let categoryData = { name: category, questions: [] };
            if (rawQuizData[category]) {
                rawQuizData[category].forEach(qArray => {
                    let qText = qArray[0];
                    let correctAns = qArray[1];
                    let options = qArray.slice(1);
                    
                    // 打亂選項 (Fisher-Yates Shuffle)
                    for (let i = options.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [options[i], options[j]] = [options[j], options[i]];
                    }
                    
                    categoryData.questions.push({
                        id: 'q_' + globalQId++,
                        text: qText,
                        options: options,
                        correct: correctAns
                    });
                });
            }
            parsedQuizData.push(categoryData);
        });

        // 加入最後一區 (加分題)
        parsedQuizData.push({
            name: "加分題",
            questions: [{
                id: 'bonus_q',
                text: "我覺得既高級又酷的單字",
                isShortAnswer: true,
                correct: "sophisticated",
                points: 20
            }]
        });

        buildTabs();
    }

    // 開始測驗
    function startQuiz() {
        const nameInput = document.getElementById('nickname').value.trim();
        if (!nameInput) {
            alert("請先輸入你的暱稱！");
            return;
        }
        nickname = nameInput;
        document.getElementById('intro-page').classList.remove('active');
        document.getElementById('quiz-page').classList.add('active');
        renderSection();
    }

    // 建立頂部標籤列
    function buildTabs() {
        const container = document.getElementById('tabs-container');
        container.innerHTML = '';
        parsedQuizData.forEach((sec, index) => {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.innerText = sec.name;
            tab.onclick = () => {
                currentSectionIndex = index;
                renderSection();
            };
            container.appendChild(tab);
        });
    }

    // 渲染當前區間的題目
    function renderSection() {
        // 更新 Tab UI
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', i === currentSectionIndex);
        });
        
        // 只水平捲動 Tab 列，避免 scrollIntoView 把整頁往上推、壓扁導覽列
        const tabsContainer = document.getElementById('tabs-container');
        const activeTab = document.querySelectorAll('.tab')[currentSectionIndex];
        if (activeTab && tabsContainer) {
            const scrollLeft = activeTab.offsetLeft - (tabsContainer.clientWidth / 2) + (activeTab.offsetWidth / 2);
            tabsContainer.scrollTo({ left: scrollLeft, behavior: 'smooth' });
        }

        const sectionData = parsedQuizData[currentSectionIndex];
        const content = document.getElementById('quiz-content');
        content.innerHTML = ''; // 清空舊內容

        sectionData.questions.forEach((q) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            
            let html = `<div class="question-text">${q.text}</div>`;
            
            if (q.isShortAnswer) {
                // 簡答題輸入框
                let currentVal = userAnswers[q.id] || "";
                html += `<input type="text" id="${q.id}" placeholder=" s_______ted" value="${currentVal}" onchange="saveAnswer('${q.id}', this.value)" autocomplete="off">`;
            } else {
                // 選擇題選項
                html += `<div class="options">`;
                q.options.forEach(opt => {
                    const isChecked = userAnswers[q.id] === opt ? 'checked' : '';
                    html += `
                        <label class="option-label">
                            <input type="radio" name="${q.id}" value="${opt}" ${isChecked} onchange="saveAnswer('${q.id}', this.value)">
                            ${opt}
                        </label>
                    `;
                });
                html += `</div>`;
            }
            card.innerHTML = html;
            content.appendChild(card);
        });

        // 捲動回頂部
        content.scrollTop = 0;

        // 控制按鈕顯示邏輯
        document.getElementById('prev-btn').style.visibility = currentSectionIndex === 0 ? 'hidden' : 'visible';
        
        if (currentSectionIndex === parsedQuizData.length - 1) {
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('submit-btn').classList.remove('hidden');
        } else {
            document.getElementById('next-btn').classList.remove('hidden');
            document.getElementById('submit-btn').classList.add('hidden');
        }
    }

    // 記錄答案
    function saveAnswer(qId, val) {
        userAnswers[qId] = val.trim(); // 簡答題順便去頭尾空白
    }

    // 切換區間
    function changeSection(step) {
        let newIndex = currentSectionIndex + step;
        if (newIndex >= 0 && newIndex < parsedQuizData.length) {
            currentSectionIndex = newIndex;
            renderSection();
        }
    }

    // 計算未作答題數
    function countUnanswered() {
        let count = 0;
        parsedQuizData.forEach(sec => {
            sec.questions.forEach(q => {
                const ans = userAnswers[q.id];
                if (ans === undefined || ans === null || String(ans).trim() === '') {
                    count++;
                }
            });
        });
        return count;
    }

    // 交卷與計算成績
    function submitQuiz() {
        const unanswered = countUnanswered();
        const confirmMsg = unanswered > 0
            ? `你有 ${unanswered} 題尚未作答，確定要交卷嗎？`
            : "確定要交卷嗎？";
        if (!confirm(confirmMsg)) {
            return;
        }

        let totalMCQs = 0;
        let correctMCQs = 0;
        let bonusPoints = 0;
        let wrongList = [];

        // 結算邏輯
        parsedQuizData.forEach(sec => {
            sec.questions.forEach(q => {
                let uAns = userAnswers[q.id] || "未作答";
                
                if (q.isShortAnswer) {
                    // 簡答題 (無大小寫之分)
                    if (uAns.toLowerCase() === q.correct.toLowerCase()) {
                        bonusPoints = q.points;
                    } else if (uAns !== "未作答" && uAns !== "") {
                        wrongList.push({ qText: q.text, uAns: uAns, cAns: q.correct });
                    }
                } else {
                    // 選擇題計數
                    totalMCQs++;
                    if (uAns === q.correct) {
                        correctMCQs++;
                    } else {
                        wrongList.push({ qText: q.text, uAns: uAns, cAns: q.correct });
                    }
                }
            });
        });

        // 計算分數 (總分100 / 選擇題數量)
        let baseScorePerQ = totalMCQs > 0 ? (100 / totalMCQs) : 0;
        let rawScore = (correctMCQs * baseScorePerQ) + bonusPoints;
        
        // 分數不超過 100，四捨五入到小數點後第一位
        let finalScore = Math.min(rawScore, 100);
        let finalScoreDisplay = (Math.round(finalScore * 10) / 10).toFixed(1);
        
        // 去除 .0 讓整數好看一點
        if (finalScoreDisplay.endsWith('.0')) {
            finalScoreDisplay = finalScoreDisplay.slice(0, -2);
        }

        // 決定評價文字
        let comment = "";
        let numScore = parseFloat(finalScoreDisplay);
        if (numScore >= 90) {
            comment = "邱慕昀在模仿邱慕昀大賽中獲得了第二名";
        } else if (numScore >= 70) {
            comment = "邱爆了";
        } else if (numScore >= 40) {
            comment = "小邱";
        } else {
            comment = "不夠邱";
        }

        // 渲染結算畫面
        document.getElementById('quiz-page').classList.remove('active');
        document.getElementById('result-page').classList.add('active');
        
        document.getElementById('result-name').innerText = `來自：${nickname}`;
        document.getElementById('final-score').innerText = finalScoreDisplay;
        document.getElementById('score-comment').innerText = comment;

        // 渲染錯題
        const wrongSection = document.getElementById('wrong-review-section');
        const wrongToggle = document.getElementById('wrong-review-toggle');
        const wrongLabel = document.getElementById('wrong-review-label');
        const wrongContainer = document.getElementById('wrong-answers');
        wrongSection.classList.remove('expanded');
        wrongContainer.innerHTML = '';
        wrongContainer.classList.add('collapsed');

        if (wrongList.length === 0) {
            wrongLabel.innerText = '📝 錯題檢閱';
            wrongContainer.innerHTML = `<div class="perfect-score">全對是人嗎</div>`;
            wrongContainer.classList.remove('collapsed');
            wrongToggle.style.display = 'none';
        } else {
            wrongLabel.innerText = `📝 錯題檢閱（${wrongList.length} 題）`;
            wrongToggle.style.display = 'flex';
            wrongList.forEach(w => {
                wrongContainer.innerHTML += `
                    <div class="wrong-item">
                        <div class="wrong-q">${w.qText}</div>
                        <div class="wrong-user">你的答案：${w.uAns}</div>
                        <div class="wrong-correct">正確答案：${w.cAns}</div>
                    </div>
                `;
            });
        }
    }

    function toggleWrongReview() {
        const section = document.getElementById('wrong-review-section');
        const container = document.getElementById('wrong-answers');
        section.classList.toggle('expanded');
        container.classList.toggle('collapsed');
    }

    // 載入時初始化
    window.onload = initQuiz;
</script>

</body>
</html>
